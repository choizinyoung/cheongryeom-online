<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오월드 청렴 트리</title>
<script src="config.js"></script>
<style>
:root{color-scheme:light;--red:#d92a2a;--red2:#fde4e4;--grn:#166534;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;background:#f1f4f8;color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-bottom:40px}
header{position:relative;background:linear-gradient(135deg,#c81e1e 0%,#b91c1c 55%,#14532d 130%);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;border-radius:0 0 34px 34px;overflow:hidden;box-shadow:0 8px 20px rgba(120,20,20,.25)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border:1px solid rgba(255,255,255,.5);border-radius:99px;background:rgba(255,255,255,.14)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
header h1{margin:0;font-size:22px;line-height:1.2}
header p{margin:4px 0 0;font-size:12.5px;opacity:.92}
.crew{display:flex;flex:none}
.crew span{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid #ffd43b;margin-left:-12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.crew img{width:80%;height:80%;object-fit:contain}
.live{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:11px 14px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:13.5px;font-weight:700}
.live em{font-style:normal;color:#ffe066;font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffd43b;margin-right:6px;box-shadow:0 0 6px #ffd43b}
.sp{position:absolute;color:#fff;opacity:.8;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.7)}}
.tabs{display:flex;margin:16px 16px 0;padding:5px;background:#fddede;border:1px solid #f9c4c4;border-radius:18px}
.tabs button{flex:1;border:0;background:none;padding:12px 0;border-radius:13px;font:inherit;font-size:15px;font-weight:800;color:#b42323;cursor:pointer}
.tabs button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
section{display:none;padding:16px}section.on{display:block}
.pick{border:2px dashed #f2c94c;background:#fffbe6;border-radius:20px;padding:12px}
.pickhead{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;color:#92400e;margin-bottom:10px}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ch{border:2px solid var(--line);background:#fff;border-radius:16px;padding:6px 4px 8px;text-align:center;cursor:pointer;font:inherit;transition:transform .15s}
.ch .im{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.ch img{max-width:86%;max-height:86%;object-fit:contain}
.ch b{display:block;font-size:13px;margin-top:2px}
.ch.on{border-color:var(--red);color:var(--red);transform:translateY(-2px);box-shadow:0 4px 10px rgba(217,42,42,.25)}
.form{background:#fff;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
label{display:block;font-size:14px;font-weight:800;margin:14px 0 8px}label:first-child{margin-top:0}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:#f9fafb;border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);resize:none}
input::placeholder,textarea::placeholder{color:#c5cad3;opacity:1}
.snow{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.snow i{position:absolute;top:-24px;font-style:normal;color:#fff;opacity:.7;text-shadow:0 0 4px rgba(100,130,170,.6);animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--sx),108vh)}}
.kws{display:flex;flex-wrap:wrap;gap:8px}
.kw{border:2px solid #bbf7d0;background:#dcfce7;color:#14532d;font:inherit;font-size:13px;font-weight:800;border-radius:99px;padding:7px 12px;cursor:pointer}
.kw.on{border-color:var(--red);background:var(--red2);color:var(--red)}
.cnt{text-align:right;font-size:12px;color:var(--sub);margin-top:6px}
.btn{width:100%;margin-top:12px;border:0;border-radius:18px;padding:17px;font:inherit;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ef3b3b,#c81e1e);box-shadow:0 8px 16px rgba(200,30,30,.35);cursor:pointer}
.btn:active{transform:translateY(2px)}.btn:disabled{opacity:.45;box-shadow:none}
.note{font-size:12px;color:var(--sub);margin:10px 2px 0}
.stage{position:relative;height:300px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#0f172a,#14532d);border:3px solid #f2b21c;margin-bottom:20px}
.stage .ttl{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#ffe58a;color:#7c2d12;font-size:12.5px;font-weight:800;padding:5px 14px;border-radius:99px;z-index:3;white-space:nowrap}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.orn{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;max-width:150px;background:#fff7ed;color:#7c2d12;border:2px solid #e11d48;border-radius:99px;padding:2px 9px 2px 3px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;z-index:2;box-shadow:0 3px 6px rgba(0,0,0,.35);animation:sway 3.4s ease-in-out infinite}
.orn img{width:20px;height:20px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.orn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:4deg}}
.lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.lh b{font-size:17px}.lh select{border:1px solid var(--line);border-radius:12px;padding:7px 10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.item{background:#fff;border-radius:16px;border-left:5px solid var(--grn);padding:13px 14px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.05);animation:pop .35s both}
.meta{display:flex;align-items:center;gap:8px;font-size:13.5px}
.av{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.av img{width:82%;height:82%;object-fit:contain}
.tag{background:#fde4e4;color:#c81e1e;font-weight:800;font-size:12px;padding:2px 8px;border-radius:7px}
.ago{margin-left:auto;font-size:12px;color:var(--sub)}
.q{font-size:15.5px;font-weight:700;margin:10px 0 4px;word-break:keep-all;overflow-wrap:anywhere}
.hk{font-size:12px;color:var(--grn);font-weight:700}
.foot{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:6px}
.heart{border:1px solid #e5e7eb;background:#f8fafc;color:#6b7280;border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.heart.on{background:#fde4e4;color:var(--red);border-color:#f5b5b5}
.x{border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer}
.empty{text-align:center;color:var(--sub);padding:28px 0;font-size:14px}
@keyframes pop{from{transform:scale(.9) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;background:rgba(8,12,28,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.on{display:flex}
.popc{width:100%;max-width:340px;background:#fff;border-radius:26px;text-align:center;padding:16px;position:relative;animation:pop .35s both}
.popc .tr{position:relative;height:200px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#0f172a,#14532d);margin-bottom:12px}
.popc .tr svg{position:absolute;inset:0;width:100%;height:100%}
.hang{position:absolute;left:50%;top:0;width:160px;margin-left:-80px;transform-origin:top center;animation:drop 1s cubic-bezier(.3,1.5,.5,1) both,sway 3s 1s ease-in-out infinite}
.hang i{display:block;width:2px;height:58px;background:#f2b21c;margin:0 auto}
.hang div{background:#fff7ed;color:#7c2d12;border:2px solid #e11d48;border-radius:14px;padding:8px 10px;font-size:13px;font-weight:800;word-break:keep-all;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.hang img{width:34px;height:34px;display:block;margin:0 auto 3px}
@keyframes drop{from{transform:translateY(-140px);opacity:0}to{transform:none;opacity:1}}
.popc h3{margin:0 0 4px;font-size:19px}.popc p{margin:0 0 12px;font-size:13px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:30;max-width:90%;text-align:center}.toast.on{opacity:1}
.fx{position:fixed;font-size:24px;pointer-events:none;z-index:40;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.admin{max-width:520px;margin:4px auto 0;padding:0 16px 30px}
.admin .box{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--sub)}
.admin .row{display:flex;gap:6px;margin-top:8px}.admin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:14px;background:#f9fafb;color:var(--ink)}
.admin button{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:13px;font-weight:800;color:#fff;background:#374151;cursor:pointer;flex:none}
.admin [hidden]{display:none}
@media (prefers-reduced-motion:reduce){.snow,.sp,.orn,.hang{animation:none}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="wrap">
<header>
  <span class="sp" style="top:10px;left:84px">❄</span><span class="sp" style="top:30px;left:56%;animation-delay:.8s">✦</span><span class="sp" style="top:96px;left:40%;animation-delay:1.4s">✦</span>
  <span class="pill">🎄 오월드 청렴 문화 확산 캠페인</span>
  <div class="hrow"><div><h1>오월드 청렴 트리 🎁</h1><p>따뜻한 연말, 오월드 트리에 청렴 한 줄을 걸어주세요</p></div><div class="crew" id="crew"></div></div>
  <div class="live"><span><i class="dot"></i>실시간 참여현황</span><em id="total">총 0개의 청렴 오너먼트 🎄</em></div>
</header>
<div id="banner" class="note" style="margin:8px 18px 0"></div>
<div class="tabs"><button data-t="write" class="on">✍️ 한 줄 걸기</button><button data-t="tree" id="treeTab">🎄 청렴 트리 (0)</button></div>

<section id="s-write" class="on">
  <div class="pick"><div class="pickhead"><span>🎅 내 청렴 한 줄을 걸어줄 캐릭터 선택</span><span>터치하세요!</span></div><div class="chars" id="chars"></div></div>
  <div class="form">
    <label>닉네임 (선택 · 미입력 시 익명)</label>
    <input type="text" id="nick" maxlength="12" placeholder="실명 혹은 닉네임 모두 가능">
    <label>크리스마스 청렴 키워드 톡!</label>
    <div class="kws" id="kws"></div>
    <label>나의 청렴 한 줄 다짐</label>
    <textarea id="ta" rows="3" maxlength="50" placeholder="예: 선물처럼 따뜻한 소통, 유리알처럼 투명한 청렴!"></textarea>
    <div class="cnt"><span id="cnt">0</span> / 50자</div>
    <button class="btn" id="go" disabled>트리에 청렴 오너먼트 걸기 🎄✨</button>
    <p class="note" id="limitNote"></p>
  </div>
  <p class="note">업무상 알게 된 개인정보, 특정인 비방, 비밀 정보는 적지 말아주세요.</p>
</section>

<section id="s-tree">
  <div class="stage" id="stageBox"><span class="ttl">✨ 오월드 크리스마스 트리</span><svg viewBox="0 0 300 300" preserveAspectRatio="xMidYMax meet" id="treeSvg"></svg></div>
  <div class="lh"><b>우리들의 청렴 메시지</b><select id="sort"><option value="new">최신순</option><option value="like">공감순</option></select></div>
  <div id="list"></div>
</section>
</div>

<div class="admin" id="admin" hidden><div class="box">
  <div id="admForm"><b>🔐 관리자 로그인</b><div class="row"><input id="admId" placeholder="아이디" autocomplete="username"><input id="admPw" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="admLogin">로그인</button></div></div>
  <div id="admOn" hidden><div class="row" style="margin:0;align-items:center"><span style="flex:1">🛡️ 관리자 모드 · 모든 글을 삭제할 수 있어요</span><button id="admLogout">로그아웃</button></div></div>
</div></div>
<div class="modal" id="modal"><div class="popc">
  <div class="tr"><svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMax meet" id="popSvg"></svg><div class="hang"><i></i><div><img id="hangImg"><span id="hangTxt"></span></div></div></div>
  <h3>🎄 트리에 오너먼트가 걸렸어요!</h3><p>따뜻한 청렴 다짐 고마워요 ✨</p>
  <button class="btn" id="popOk" style="margin-top:0">청렴 트리 보러가기</button>
</div></div>
<div class="toast" id="toast"></div>

const CH=["늑구","다감이","다정이","타마"];            /* 순서 = IMGS 순서 */
const KWS=[["🎄","기본과원칙"],["🎁","상호존중"],["✨","공정투명"],["🔔","갑질근절"]];
const SLOTS=[[50,22],[38,34],[62,34],[28,48],[50,44],[72,48],[24,62],[42,58],[60,58],[76,62],[34,72],[66,72]];
const API=(window.API_BASE||"").replace(/\/$/,"");
const TK="cr_token",ATK="cr_admin_token";
let MAX=10,me={uid:null,isAdmin:false},online=false,selCh=0,selKw=null,busy=false,lines=[];
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}};
const chOf=c=>Number.isInteger(c)&&c>=0&&c<4?c:0;
function avatar(i){const a=el("span","av"),im=el("img");im.src=IMGS[i];a.appendChild(im);return a;}
function ago(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return"방금 전";if(m<60)return m+"분 전";const h=Math.floor(m/60);return h<24?h+"시간 전":Math.floor(h/24)+"일 전";}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200);}
function burst(from){const r=from.getBoundingClientRect(),em=["🎄","✨","❄️","🎁","⭐","🔔"];
  for(let i=0;i<16;i++){const s=el("span","fx",em[i%6]);s.style.left=(r.left+r.width/2)+"px";s.style.top=r.top+"px";s.style.setProperty("--dx",(Math.random()*240-120)+"px");s.style.setProperty("--dy",(-60-Math.random()*160)+"px");s.style.setProperty("--r",(Math.random()*360)+"deg");document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}
const myCount=()=>lines.filter(e=>e.mine).length;
function treeSvg(h){return `<ellipse cx="150" cy="${h-12}" rx="125" ry="11" fill="#f8fafc"/>
<rect x="132" y="${h-58}" width="36" height="46" rx="4" fill="#7c3f12"/>
<polygon points="150,${h*.16} 82,${h*.5} 218,${h*.5}" fill="#15803d"/>
<polygon points="150,${h*.3} 62,${h*.7} 238,${h*.7}" fill="#16a34a"/>
<polygon points="150,${h*.44} 44,${h-56} 256,${h-56}" fill="#22a55a"/>
<polygon points="150,${h*.04} 156,${h*.11} 166,${h*.11} 158,${h*.17} 161,${h*.25} 150,${h*.2} 139,${h*.25} 142,${h*.17} 134,${h*.11} 144,${h*.11}" fill="#ffd43b"/>
<g fill="#fde047"><circle cx="112" cy="${h*.56}" r="3.5"/><circle cx="192" cy="${h*.62}" r="3.5"/><circle cx="92" cy="${h*.78}" r="3.5"/><circle cx="210" cy="${h*.8}" r="3.5"/></g><g fill="#fb7185"><circle cx="130" cy="${h*.7}" r="3.5"/><circle cx="172" cy="${h*.76}" r="3.5"/></g>`;}

/* ---------- API ---------- */
function token(){return store.get(ATK)||store.get(TK);}
async function api(path,opt={},retry=true){
  const h={"Content-Type":"application/json"},t=token();if(t)h.Authorization="Bearer "+t;
  const r=await fetch(API+"/api"+path,{...opt,headers:h,body:opt.body&&JSON.stringify(opt.body)});
  if(r.status===401&&retry&&!path.startsWith("/auth")){
    if(store.get(ATK)){store.set(ATK,null);toast("관리자 로그인이 만료됐어요");}else store.set(TK,null);
    await auth();return api(path,opt,false);}
  const d=r.status===204?null:await r.json().catch(()=>null);
  if(!r.ok){const e=new Error((d&&d.message)||"요청에 실패했어요");e.status=r.status;e.code=d&&d.error;throw e;}
  return d;}
async function auth(){
  if(token()){try{const m=await api("/me",{},false);me={uid:m.uid,isAdmin:m.isAdmin};MAX=m.maxPerUser||MAX;return;}catch(e){if(e.status!==401)throw e;store.set(ATK,null);store.set(TK,null);}}
  const a=await api("/auth/anon",{method:"POST"});store.set(TK,a.token);me={uid:a.uid,isAdmin:false};}
async function load(){
  const d=await api("/lines");lines=d.lines.map(e=>({...e,ch:chOf(e.ch)}));MAX=d.maxPerUser||MAX;renderAll();}
let loadT=null;
function reload(){clearTimeout(loadT);loadT=setTimeout(()=>load().catch(()=>{}),200);}

/* ---------- 렌더 ---------- */
function renderForm(){
  const c=$("#chars");c.textContent="";
  CH.forEach((n,i)=>{const b=el("button","ch"+(selCh===i?" on":"")),w=el("div","im"),im=el("img");im.src=IMGS[i];w.appendChild(im);b.append(w,el("b","",n));b.onclick=()=>{selCh=i;renderForm();};c.appendChild(b);});
  const k=$("#kws");k.textContent="";
  KWS.forEach(([e,n])=>{const b=el("button","kw"+(selKw===n?" on":""),e+" #"+n);b.onclick=()=>{selKw=selKw===n?null:n;renderForm();};k.appendChild(b);});
  const left=MAX-myCount();
  $("#limitNote").textContent=left>0?"남은 기회 "+left+"번 (1인 최대 "+MAX+"개)":"오너먼트를 모두 걸었어요! 청렴 트리에서 동료들의 한 줄을 구경해보세요 🎄";
  check();}
function check(){$("#go").disabled=busy||!($("#ta").value.trim()&&myCount()<MAX);}
function renderTree(){
  const list=lines,box=$("#stageBox");
  $("#total").textContent="총 "+list.length+"개의 청렴 오너먼트 🎄";$("#treeTab").textContent="🎄 청렴 트리 ("+list.length+")";
  $("#treeSvg").innerHTML=treeSvg(300);box.querySelectorAll(".orn").forEach(n=>n.remove());
  list.slice(0,SLOTS.length).forEach((e,i)=>{const b=el("button","orn"),im=el("img");im.src=IMGS[e.ch];b.append(im,el("span","",e.t));
    b.style.left=SLOTS[i][0]+"%";b.style.top=SLOTS[i][1]+"%";b.style.animationDelay=(-i*.45)+"s";b.onclick=()=>toast(CH[e.ch]+" · "+e.nick+": "+e.t);box.appendChild(b);});
  const L=$("#list");L.textContent="";const s=[...list];if($("#sort").value==="like")s.sort((a,b)=>b.hearts-a.hearts||b.ts-a.ts);
  if(!s.length){L.appendChild(el("div","empty","아직 트리가 비어 있어요. 첫 번째 오너먼트를 걸어주세요! 🎄"));return;}
  s.forEach(e=>{const c=el("div","item"),m=el("div","meta");
    m.append(avatar(e.ch),el("span","tag",CH[e.ch]),el("b","",e.nick),el("span","ago",ago(e.ts)));c.appendChild(m);
    c.appendChild(el("div","q","“"+e.t+"”"));if(e.k)c.appendChild(el("div","hk","#"+e.k));
    const f=el("div","foot");if(e.mine||me.isAdmin){const x=el("button","x","삭제");x.onclick=()=>{if(x.dataset.arm){removeEntry(e);return;}x.dataset.arm=1;x.textContent="한 번 더 누르면 삭제";x.style.color="#d92a2a";setTimeout(()=>{delete x.dataset.arm;x.textContent="삭제";x.style.color="";},3000);};f.appendChild(x);}
    const h=el("button","heart"+(e.liked?" on":""),"💗 공감 "+e.hearts);h.onclick=()=>toggleHeart(e);f.appendChild(h);c.appendChild(f);L.appendChild(c);});}
function renderAdmin(){
  const box=$("#admin");if(!box)return;box.hidden=!(me.isAdmin||/[?&]admin\b/.test(location.search));
  $("#admForm").hidden=me.isAdmin;$("#admOn").hidden=!me.isAdmin;}
function renderAll(){renderForm();renderTree();renderAdmin();}

/* ---------- 동작 ---------- */
async function submit(){
  const t=$("#ta").value.trim();if(!t||busy||myCount()>=MAX)return;
  const body={nick:$("#nick").value.trim(),ch:selCh,k:selKw,t};
  busy=true;check();
  try{
    if(online){const d=await api("/lines",{method:"POST",body});lines=[d.line,...lines.filter(x=>x.id!==d.line.id)];}
    else lines=[{id:"local_"+Date.now(),nick:body.nick||"익명",ch:selCh,k:selKw,t,ts:Date.now(),hearts:0,liked:false,mine:true},...lines];
  }catch(e){toast(e.message||"저장에 실패했어요. 잠시 후 다시 시도해주세요");if(e.code==="LIMIT_REACHED")reload();return;}
  finally{busy=false;check();}
  burst($("#go"));
  $("#hangTxt").textContent=t;$("#hangImg").src=IMGS[selCh];$("#popSvg").innerHTML=treeSvg(200);$("#modal").classList.add("on");
  $("#ta").value="";$("#cnt").textContent="0";$("#nick").value="";selKw=null;renderAll();}
async function removeEntry(e){
  const prev=lines;lines=lines.filter(x=>x.id!==e.id);renderAll();if(!online)return;
  try{await api("/lines/"+encodeURIComponent(e.id),{method:"DELETE"});}
  catch(err){if(err.status!==404){lines=prev;renderAll();toast(err.message);}}}
async function toggleHeart(e){
  const on=!e.liked;e.liked=on;e.hearts+=on?1:-1;renderTree();if(!online)return;
  try{const d=await api("/lines/"+encodeURIComponent(e.id)+"/heart",{method:on?"PUT":"DELETE"});e.hearts=d.hearts;e.liked=d.liked;renderTree();}
  catch(err){e.liked=!on;e.hearts+=on?-1:1;renderTree();toast(err.status===404?err.message:"공감 저장에 실패했어요");if(err.status===404)reload();}}
async function adminLogin(){
  const username=$("#admId").value.trim(),password=$("#admPw").value;if(!username||!password)return toast("아이디와 비밀번호를 입력해주세요");
  try{const a=await api("/auth/admin",{method:"POST",body:{username,password}});store.set(ATK,a.token);me={uid:a.uid,isAdmin:true};$("#admPw").value="";toast("관리자 모드로 전환했어요");await load();}
  catch(e){toast(e.message);}}
async function adminLogout(){store.set(ATK,null);me={uid:null,isAdmin:false};try{await auth();await load();}catch(e){}toast("로그아웃했어요");renderAll();}
function go(t){document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="s-"+t));window.scrollTo({top:0});}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.t));
$("#ta").addEventListener("input",()=>{$("#cnt").textContent=$("#ta").value.length;check();});
$("#go").onclick=submit;$("#sort").onchange=renderTree;$("#popOk").onclick=()=>{$("#modal").classList.remove("on");go("tree");};
$("#admLogin").onclick=adminLogin;$("#admPw").onkeydown=e=>{if(e.key==="Enter")adminLogin();};$("#admLogout").onclick=adminLogout;
IMGS.forEach(s=>{const w=el("span"),i=el("img");i.src=s;w.appendChild(i);$("#crew").appendChild(w);});$("#crew").firstChild.style.marginLeft="0";

for(let i=0;i<28;i++){const s=el("i","","❄");s.style.left=Math.random()*100+"%";s.style.fontSize=(7+Math.random()*9)+"px";s.style.opacity=(.35+Math.random()*.4).toFixed(2);s.style.animationDuration=(12+Math.random()*12)+"s";s.style.animationDelay=(-Math.random()*24)+"s";s.style.setProperty("--sx",(Math.random()*80-40)+"px");$("#snow").appendChild(s);}
(async function init(){
  renderAll();
  const timer=setTimeout(()=>{$("#banner").textContent="데이터를 불러오는 중이에요. 네트워크를 확인해주세요.";},10000);
  try{await auth();await load();online=true;$("#banner").textContent="";}
  catch(e){$("#banner").textContent="미리보기 모드: 서버에 연결하지 못했어요. 작성한 내용은 이 화면에만 보여요.";return;}
  finally{clearTimeout(timer);}
  // 실시간 반영: SSE 로 변경 알림 → 다시 불러오기. 끊겨도 30초마다 갱신
  try{const es=new EventSource(API+"/api/events");es.addEventListener("change",reload);}catch(e){}
  setInterval(()=>{if(document.visibilityState==="visible")reload();},30000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reload();});
})();
</script>
</body>
